<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meshiach graph</title>
<style>
  :root {
    --bg: #faf8f3; --fg: #1f1d1a; --muted: #6b655c; --panel: #ffffff; --line: #e2ddd3;
    --theme: #2b2d42; --heb: #e9b949; --arc: #e4863a; --grk: #4a7bd8; --jew: #4c9a5a;
    --jewish: #2e7d32; --christian: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --fg: #ece8e0; --muted: #a39d92; --panel: #221f25; --line: #39353d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr minmax(320px, 460px); height: 100vh; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; } }
  #graph { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  svg[hidden] { display: none; }
  #controls { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
  #controls input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
  .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; cursor: pointer; user-select: none; }
  .chip.off { opacity: .4; }
  #legend { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  #legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: -1px; }
  #panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 20px 24px 40px; }
  @media (max-width: 800px) { #panel { border-left: 0; border-top: 1px solid var(--line); } }
  #panel h1 { font-size: 20px; margin: 0 0 2px; }
  #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 6px; }
  .ref { color: var(--muted); font-size: 13px; }
  .orig { font-size: 22px; line-height: 1.7; margin: 8px 0 4px; }
  .orig[dir="rtl"] { font-family: "SBL Hebrew", "Ezra SIL", "Times New Roman", serif; }
  .orig.el { font-family: "SBL Greek", "Gentium Plus", "Times New Roman", serif; font-size: 19px; }
  .eng { margin: 0 0 6px; }
  .w { cursor: help; border-bottom: 1px dotted var(--muted); border-radius: 2px; padding: 0 1px; }
  .w:hover { background: color-mix(in srgb, var(--heb) 35%, transparent); }
  .w.diff { border-bottom: 2px solid var(--arc); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .pair:first-of-type { border-top: 0; }
  .pair .orig { font-size: 17px; margin: 0; }
  .pair .eng { font-size: 14px; color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); margin: 2px 3px 0 0; color: var(--muted); }
  .theme-pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--theme); color: #fff; margin-left: 6px; vertical-align: 2px; }
  a.rel { color: var(--grk); cursor: pointer; text-decoration: underline dotted; }
  .empty { color: var(--muted); margin-top: 40px; }
  .verse { display: grid; grid-template-columns: 2.2em 1fr; gap: 0 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .verse .vref { color: var(--muted); font-size: 12px; padding-top: 10px; }
  .verse .orig { grid-column: 2; font-size: 19px; margin: 0; }
  .verse .eng { grid-column: 2; font-size: 14px; color: var(--muted); margin: 2px 0 0; }
  .verse.key { background: color-mix(in srgb, var(--heb) 12%, transparent); border-radius: 6px; padding-left: 6px; padding-right: 6px; }
  details.notes { margin-top: 24px; color: var(--muted); font-size: 13px; }
  details.notes summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 340px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  #tip .lemma { font-size: 18px; font-weight: 600; }
  #tip .gloss { margin: 2px 0 6px; }
  #tip .ctx { color: var(--muted); }
  #tip .rd { margin-top: 6px; padding-left: 8px; border-left: 3px solid; }
  #tip .rd.j { border-color: var(--jewish); }
  #tip .rd.c { border-color: var(--christian); }
  #tip .rd b { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .node text { font-size: 10px; fill: var(--fg); cursor: pointer; }
  .node.theme text { font-size: 12px; font-weight: 600; }
  .link { stroke: var(--muted); stroke-opacity: .35; }
  .link.rel { stroke-dasharray: 4 3; stroke: var(--jew); stroke-opacity: .8; }
  .node.selected circle { stroke: var(--fg); stroke-width: 3px; }
  .node.dim, .link.dim { opacity: .12; }
  #tl { cursor: default; height: auto; }
  #graph.tl-mode { overflow-y: auto; }
  #graph.tl-mode #legend { display: none; }
  #tl .axis text { font-size: 11px; fill: var(--muted); }
  #tl .axis line, #tl .axis path { stroke: var(--line); }
  #tl .row text { font-size: 10px; fill: var(--fg); }
  #tl .theme-label { font-size: 11px; font-weight: 600; fill: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #tl .span { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 3; }
  #tl .dot { cursor: pointer; stroke: var(--panel); stroke-width: 1.5; }
  #tl .dot.trad { fill: none; stroke: var(--fg); stroke-dasharray: 2 2; }
  #tl .marker line { stroke: var(--grk); stroke-width: 1.5; }
  #tl .marker text { font-size: 11px; fill: var(--grk); font-weight: 600; }
  #tl .dot.dim, #tl .span.dim, #tl .row text.dim { opacity: .12; }
  #tl .dot.selected { stroke: var(--fg); stroke-width: 3; }
</style>
</head>
<body>
<div id="app">
  <div id="graph">
    <div id="controls">
      <input id="q" type="search" placeholder="Search ref, title, text…" aria-label="Search">
      <div id="chips"></div>
      <span class="chip" id="vowels" title="Show vowel points (niqqud)">vowels</span>
      <span class="chip view" id="view-timeline" title="Switch between graph and timeline">timeline</span>
    </div>
    <svg id="svg" role="img" aria-label="Prophecy graph"></svg>
    <svg id="tl" role="img" aria-label="Prophecy timeline" hidden></svg>
    <div id="legend">
      <span style="--c:var(--theme)">theme</span>
      <span style="--c:var(--heb)">Hebrew</span>
      <span style="--c:var(--arc)">Aramaic</span>
      <span style="--c:var(--jew)">Targum / Talmud / Qumran</span>
      <span style="--c:var(--grk)">Greek NT</span>
    </div>
  </div>
  <aside id="panel">
    <p class="empty">Click a passage node to read it. Hover an underlined word to see its gloss. Words with a double underline are read differently by Jewish and Christian tradition. Toggle <b>vowels</b> for pointed Hebrew.</p>
  </aside>
</div>
<div id="tip" role="tooltip"></div>

<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  const entries = window.MESHIACH || [];
  const byId = Object.fromEntries(entries.map(e => [e.id, e]));
  const THEMES = ["lineage","covenant","birth","forerunner","ministry","suffering","death","resurrection","exaltation","kingdom","return"]
    .filter(t => entries.some(e => e.theme === t));
  const color = { theme: "var(--theme)", he: "var(--heb)", arc: "var(--arc)", jew: "var(--jew)", nt: "var(--grk)" };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const shortRef = r => r.replace(/\s*\[[^\]]*\]/, "").replace("Targum Jonathan on ", "Tg ");

  // ---- build nodes / links -------------------------------------------------
  const nodes = [], links = [];
  THEMES.forEach(t => nodes.push({ id: "theme:" + t, kind: "theme", label: t[0].toUpperCase() + t.slice(1), theme: t }));
  const ntSeen = new Map();
  entries.forEach(e => {
    const kind = (e.source.kind || "tanakh") !== "tanakh" ? "jew" : e.source.lang;
    nodes.push({ id: e.id, kind, label: shortRef(e.source.ref), entry: e, theme: e.theme });
    links.push({ source: "theme:" + e.theme, target: e.id, type: "theme" });
    (e.fulfilment || []).forEach(f => {
      const nid = "nt:" + f.ref;
      if (!ntSeen.has(nid)) { ntSeen.set(nid, { id: nid, kind: "nt", label: f.ref, nt: f, sources: [] }); nodes.push(ntSeen.get(nid)); }
      ntSeen.get(nid).sources.push(e.id);
      links.push({ source: e.id, target: nid, type: "fulfil" });
    });
    (e.relates_to || []).forEach(r => links.push({ source: e.id, target: r, type: "rel" }));
  });

  // ---- svg -----------------------------------------------------------------
  const svg = d3.select("#svg");
  const g = svg.append("g");
  const box = () => document.getElementById("graph").getBoundingClientRect();

  const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", ev => g.attr("transform", ev.transform));
  svg.call(zoom);

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(l => l.type === "theme" ? 70 : 40).strength(l => l.type === "rel" ? .3 : .7))
    .force("charge", d3.forceManyBody().strength(d => d.kind === "theme" ? -350 : d.kind === "nt" ? -60 : -140))
    .force("x", d3.forceX(() => box().width / 2).strength(.06))
    .force("y", d3.forceY(() => box().height / 2).strength(.06))
    .force("collide", d3.forceCollide(d => r(d) + 8))
    .on("end", fit);

  function fit() {
    const b = box();
    const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
    const x0 = Math.min(...xs) - 40, x1 = Math.max(...xs) + 40, y0 = Math.min(...ys) - 40, y1 = Math.max(...ys) + 40;
    const k = Math.min(b.width / (x1 - x0), b.height / (y1 - y0), 1.5);
    const t = d3.zoomIdentity.translate(b.width / 2 - k * (x0 + x1) / 2, b.height / 2 - k * (y0 + y1) / 2).scale(k);
    svg.transition().duration(500).call(zoom.transform, t);
  }

  function r(d) { return d.kind === "theme" ? 18 : d.kind === "nt" ? 6 : 10; }

  const link = g.append("g").selectAll("line").data(links).join("line")
    .attr("class", d => "link " + d.type).attr("stroke-width", d => d.type === "theme" ? 1 : 1.5);
  const node = g.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", d => "node " + d.kind)
    .call(d3.drag().clickDistance(6).on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on("end", (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = d.fy = null; }))
    .on("click", (ev, d) => select(d));
  node.append("circle").attr("r", r).attr("fill", d => color[d.kind]).attr("stroke", "var(--panel)").attr("stroke-width", 1.5);
  node.append("text").attr("dy", d => r(d) + 11).attr("text-anchor", "middle").text(d => d.label);
  node.append("title").text(d => d.entry ? d.entry.title : d.nt ? d.nt.english : d.label);

  sim.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });
  window.addEventListener("resize", () => { sim.alpha(.3).restart(); });

  // ---- filters -------------------------------------------------------------
  const active = new Set(THEMES);
  const chips = d3.select("#chips").selectAll("span").data(THEMES).join("span").attr("class", "chip").text(d => d)
    .on("click", (ev, t) => { active.has(t) ? active.delete(t) : active.add(t); chips.classed("off", d => !active.has(d)); applyFilter(); });
  document.getElementById("q").addEventListener("input", applyFilter);

  function matches(n, q) {
    if (n.kind === "theme") return active.has(n.theme);
    if (n.kind === "nt") return n.sources.some(id => matches(nodes.find(x => x.id === id), q));
    const e = n.entry;
    if (!active.has(e.theme)) return false;
    if (!q) return true;
    const hay = [e.title, e.source.ref, e.source.text, e.source.english, e.jewish_reading, e.christian_reading, e.notes, (e.tags || []).join(" "),
      ...(e.passage || []).flatMap(v => [v.ref, v.text, v.english]),
      ...(e.fulfilment || []).flatMap(f => [f.ref, f.text, f.english])].join(" ").toLowerCase();
    return hay.includes(q);
  }
  function applyFilter() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const ok = new Map(nodes.map(n => [n.id, matches(n, q)]));
    node.classed("dim", d => !ok.get(d.id));
    link.classed("dim", d => !(ok.get(d.source.id) && ok.get(d.target.id)));
    tlSvg.selectAll(".row").each(function (e) { d3.select(this).selectAll(".dot, .span, text").classed("dim", !ok.get(e.id)); });
  }

  // ---- panel ---------------------------------------------------------------
  const panel = document.getElementById("panel");
  function select(d) {
    node.classed("selected", n => n === d);
    tlSvg.selectAll(".dot.crit").classed("selected", function () { return d3.select(this.parentNode).datum() === d.entry; });
    if (d.entry) renderEntry(d.entry);
    else if (d.nt) renderNT(d);
    else renderTheme(d.theme);
  }
  window.selectId = id => { const n = nodes.find(x => x.id === id); if (n) select(n); };

  let showVowels = false;
  try { showVowels = localStorage.getItem("meshiach.vowels") === "1"; } catch (e) {}
  const vowelsBtn = document.getElementById("vowels");
  vowelsBtn.classList.toggle("off", !showVowels);
  vowelsBtn.addEventListener("click", () => {
    showVowels = !showVowels;
    vowelsBtn.classList.toggle("off", !showVowels);
    try { localStorage.setItem("meshiach.vowels", showVowels ? "1" : "0"); } catch (e) {}
    if (current) renderEntry(current);
  });
  let current = null;

  function origHTML(src, words, lang) {
    lang = lang || src.lang;
    const rtl = lang === "he" || lang === "arc";
    const usePointed = showVowels && src.text_pointed && src.text_pointed.split(/\s+/).length === src.text.split(/\s+/).length;
    const display = (usePointed ? src.text_pointed : src.text).split(/\s+/);
    const tokens = src.text.split(/\s+/);
    let wi = 0;
    const spans = tokens.map((t, i) => {
      const shown = display[i];
      if (t === "...") return "…";
      const w = words && words[wi] && words[wi].w === t ? words[wi] : null;
      if (words) wi++;
      if (!w) return esc(shown);
      const diff = w.readings ? " diff" : "";
      return `<span class="w${diff}" data-w='${esc(JSON.stringify(w))}'>${esc(shown)}</span>`;
    });
    return `<p class="orig ${lang}" lang="${lang}" dir="${rtl ? "rtl" : "ltr"}">${spans.join(" ")}</p>`;
  }

  function renderEntry(e) {
    current = e;
    const kind = e.source.kind || "tanakh";
    const rels = (e.relates_to || []).map(id => byId[id]).filter(Boolean);
    const backRels = entries.filter(x => (x.relates_to || []).includes(e.id));
    panel.innerHTML = `
      <div class="ref">${esc(e.source.ref)}${kind !== "tanakh" ? " · " + esc(kind) : ""}<span class="theme-pill">${esc(e.theme)}</span></div>
      <h1>${esc(e.title)}</h1>
      ${e.passage ? `
        <h2>Passage · ${esc(e.passage[0].ref)} – ${esc(e.passage[e.passage.length - 1].ref.replace(/^\D+/, ""))}</h2>
        <p class="ref">Key verse: ${esc(e.source.ref)}. Verses with glosses are underlined.</p>
        ${e.passage.map(v => `
          <div class="verse${v.ref === e.source.ref.replace(/\s*\[[^\]]*\]/, "").replace(/^Psalm /, "Psalms ") ? " key" : ""}">
            <div class="vref">${esc(v.ref.replace(/^\D+/, ""))}</div>
            ${origHTML(v, v.words, e.source.lang)}
            <p class="eng">${esc(v.english)}</p>
          </div>`).join("")}`
      : `
        <h2>Original</h2>
        ${origHTML(e.source, e.words)}
        <p class="eng">${esc(e.source.english)}</p>`}
      <h2>Jewish reading</h2><p>${esc(e.jewish_reading || "—")}</p>
      <h2>Christian reading</h2><p>${esc(e.christian_reading || "—")}</p>
      ${(e.fulfilment || []).length ? `<h2>Christian verses</h2>` : ""}
      ${(e.fulfilment || []).map(f => `
        <div class="pair">
          <div><div class="ref">${esc(f.ref)}</div><p class="orig el" lang="el">${esc(f.text)}</p></div>
          <div class="eng">${esc(f.english)}</div>
        </div>`).join("")}
      ${rels.length ? `<h2>Comments on</h2><p>${rels.map(x => `<a class="rel" onclick="selectId('${x.id}')">${esc(x.source.ref)}</a>`).join(" · ")}</p>` : ""}
      ${backRels.length ? `<h2>Read messianically by</h2><p>${backRels.map(x => `<a class="rel" onclick="selectId('${x.id}')">${esc(x.source.ref)}</a>`).join(" · ")}</p>` : ""}
      ${(e.tags || []).length ? `<h2>Tags</h2>${e.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}` : ""}
      ${e.notes ? `<details class="notes"><summary>Textual notes</summary><p>${esc(e.notes)}</p></details>` : ""}`;
    panel.scrollTop = 0;
  }
  function renderNT(n) {
    panel.innerHTML = `
      <div class="ref">New Testament</div><h1>${esc(n.nt.ref)}</h1>
      <p class="orig el" lang="el">${esc(n.nt.text)}</p><p class="eng">${esc(n.nt.english)}</p>
      <h2>Claims fulfilment of</h2>
      <p>${n.sources.map(id => `<a class="rel" onclick="selectId('${id}')">${esc(byId[id].source.ref)}</a>`).join(" · ")}</p>`;
  }
  function renderTheme(t) {
    const list = entries.filter(e => e.theme === t);
    panel.innerHTML = `<div class="ref">Theme</div><h1>${esc(t[0].toUpperCase() + t.slice(1))}</h1>
      <h2>${list.length} passages</h2>
      ${list.map(e => `<p><a class="rel" onclick="selectId('${e.id}')">${esc(e.source.ref)}</a> — ${esc(e.title)}</p>`).join("")}`;
  }

  // ---- timeline ------------------------------------------------------------
  const tlSvg = d3.select("#tl");
  const tlBtn = document.getElementById("view-timeline");
  let showTimeline = false;
  function dateOf(e) {
    const d = e.date;
    if (d == null) return null;
    if (typeof d === "number") return { crit: d, trad: d };
    return { crit: d.critical, trad: d.traditional };
  }
  const fmtYear = y => y < 0 ? `${-y} BCE` : `${y} CE`;
  function drawTimeline() {
    const b = box();
    const dated = entries.filter(e => dateOf(e));
    const years = dated.flatMap(e => { const d = dateOf(e); return [d.crit, d.trad]; });
    const left = 110, right = 24, top = 130, bottom = 44, rowH = 17;
    const H = top + dated.length * rowH + bottom;
    tlSvg.attr("viewBox", `0 0 ${b.width} ${H}`).attr("width", b.width).attr("height", H).selectAll("*").remove();
    const x = d3.scaleLinear().domain([Math.min(...years) - 60, Math.max(...years, 100) + 60]).range([left, b.width - right]);
    const themesHere = THEMES.filter(t => dated.some(e => e.theme === t));
    const g = tlSvg.append("g");
    // axis
    const axis = d3.axisTop(x).ticks(Math.max(3, Math.floor((b.width - left - right) / 110))).tickFormat(fmtYear);
    g.append("g").attr("class", "axis").attr("transform", `translate(0,${top - 14})`).call(axis);
    // markers
    [[30, "Jesus' ministry and death, c. 30 CE"], [70, "Temple destroyed, 70 CE"]].forEach(([y, label], i) => {
      const m = g.append("g").attr("class", "marker");
      m.append("line").attr("x1", x(y)).attr("x2", x(y)).attr("y1", top - 4).attr("y2", H - bottom + 8);
      m.append("text").attr("x", x(y)).attr("y", H - bottom + 22 + i * 14).attr("text-anchor", i ? "start" : "end").attr("dx", i ? 6 : -6).text(label);
    });
    // rows grouped by theme
    let yi = 0;
    themesHere.forEach(t => {
      g.append("text").attr("class", "theme-label").attr("x", 8).attr("y", top + yi * rowH + 10).text(t);
      dated.filter(e => e.theme === t).forEach(e => {
        const d = dateOf(e), cy = top + yi * rowH + 10;
        const row = g.append("g").attr("class", "row").datum(e);
        if (d.crit !== d.trad) row.append("line").attr("class", "span").attr("x1", x(d.trad)).attr("x2", x(d.crit)).attr("y1", cy).attr("y2", cy);
        const kind = (e.source.kind || "tanakh") !== "tanakh" ? "jew" : e.source.lang;
        if (d.crit !== d.trad) row.append("circle").attr("class", "dot trad").attr("r", 4).attr("cx", x(d.trad)).attr("cy", cy)
          .append("title").text(`${e.source.ref}: traditional dating c. ${fmtYear(d.trad)}`);
        row.append("circle").attr("class", "dot crit").attr("r", 5).attr("cx", x(d.crit)).attr("cy", cy).attr("fill", color[kind])
          .on("click", () => select(nodes.find(n => n.id === e.id)))
          .append("title").text(`${e.source.ref}: ${e.title} (${d.crit === d.trad ? "c. " + fmtYear(d.crit) : "critical dating c. " + fmtYear(d.crit)})`);
        row.append("text").attr("x", Math.max(x(d.crit), x(d.trad)) + 9).attr("y", cy + 3.5).text(shortRef(e.source.ref))
          .on("click", () => select(nodes.find(n => n.id === e.id))).style("cursor", "pointer");
        yi++;
      });
    });
    g.append("text").attr("class", "theme-label").attr("x", 8).attr("y", top - 36)
      .text("filled dot: critical dating · dashed dot: traditional dating · joined when they differ");
    applyFilter();
  }
  tlBtn.addEventListener("click", () => {
    showTimeline = !showTimeline;
    tlBtn.classList.toggle("off", !showTimeline);
    document.getElementById("svg").toggleAttribute("hidden", showTimeline);
    document.getElementById("tl").toggleAttribute("hidden", !showTimeline);
    document.getElementById("graph").classList.toggle("tl-mode", showTimeline);
    if (showTimeline) drawTimeline();
  });
  tlBtn.classList.add("off");
  window.addEventListener("resize", () => { if (showTimeline) drawTimeline(); });

  // ---- word tooltip --------------------------------------------------------
  const tip = document.getElementById("tip");
  panel.addEventListener("mouseover", ev => {
    const el = ev.target.closest(".w"); if (!el) return;
    const w = JSON.parse(el.dataset.w);
    tip.innerHTML = `<div class="lemma">${esc(w.lemma || w.w)}</div>
      <div class="gloss">${esc(w.gloss)}</div>
      ${w.context ? `<div class="ctx">In context: ${esc(w.context)}</div>` : ""}
      ${w.readings ? `<div class="rd j"><b>Jewish reading</b><br>${esc(w.readings.jewish)}</div>
                      <div class="rd c"><b>Christian reading</b><br>${esc(w.readings.christian)}</div>` : ""}`;
    tip.style.display = "block";
    place(ev);
  });
  panel.addEventListener("mousemove", ev => { if (tip.style.display === "block" && ev.target.closest(".w")) place(ev); });
  panel.addEventListener("mouseout", ev => { if (ev.target.closest(".w")) tip.style.display = "none"; });
  function place(ev) {
    const pad = 14, W = tip.offsetWidth, H = tip.offsetHeight;
    let x = ev.clientX + pad, y = ev.clientY + pad;
    if (x + W > innerWidth - 8) x = ev.clientX - W - pad;
    if (y + H > innerHeight - 8) y = ev.clientY - H - pad;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
})();
</script>
</body>
</html>
